<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#FF6B35" stroke="#FFA07A" stroke-width="2"/>
  
  <!-- Om symbol in white -->
  <g transform="translate(32, 32)">
    <!-- Main Om character -->
    <path d="M -8 -12 Q -12 -8, -12 -2 Q -12 4, -8 8 L -4 8 Q -8 4, -8 -2 Q -8 -6, -6 -8 L 0 -8 L 0 8 L 4 8 L 4 -8 L 8 -8 Q 12 -6, 12 -2 L 12 2 Q 12 6, 8 8 L 4 8" 
          fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Top curve -->
    <path d="M -6 -12 Q 0 -16, 6 -12" 
          fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Dot -->
    <circle cx="0" cy="-18" r="2" fill="#FFFFFF"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"/>
</svg>