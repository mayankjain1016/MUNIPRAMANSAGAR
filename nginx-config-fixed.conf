server {
    server_name nirbhayvani.com www.nirbhayvani.com;

    # CRITICAL: Allow large file uploads (50MB)
    client_max_body_size 50M;

    root /var/www/MUNIPRAMANSAGAR/dist;
    index index.html;

    # Frontend - serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache index.html to prevent stale JS bundle errors
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Backend API
    location /api {
        proxy_pass http://localhost:5005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Allow large uploads for API
        client_max_body_size 50M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # Backend uploads
    location /uploads {
        proxy_pass http://localhost:5005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nirbhayvani.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nirbhayvani.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.nirbhayvani.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = nirbhayvani.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name nirbhayvani.com www.nirbhayvani.com;
    return 404; # managed by Certbot
}
